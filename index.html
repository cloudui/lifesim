<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d16" />
    <title>Life Connections</title>
  </head>
  <body>
    <!-- One full-window stage. Each tab is a scene that fills it; the HUD floats on top. -->
    <main id="stage">
      <section id="view-walk" class="view"></section>
      <section id="view-map" class="view" hidden></section>
      <section id="view-circle" class="view" hidden></section>
      <section id="view-people" class="view" hidden></section>
      <section id="view-journal" class="view" hidden></section>
    </main>

    <header id="hud-top" class="hud">
      <div class="hud-who">
        <div id="hud-name">…</div>
        <div id="hud-when"></div>
        <div id="hud-circle"></div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Views">
        <button id="tab-walk" role="tab" type="button"><kbd>1</kbd>Walk</button>
        <button id="tab-map" role="tab" type="button"><kbd>2</kbd>Map</button>
        <button id="tab-circle" role="tab" type="button"><kbd>3</kbd>Circle</button>
        <button id="tab-people" role="tab" type="button"><kbd>4</kbd>People</button>
        <button id="tab-journal" role="tab" type="button"><kbd>5</kbd>Journal</button>
      </nav>
      <div class="hud-menu">
        <button id="lives-btn" type="button" title="Choose another life">Lives</button>
      </div>
    </header>

    <footer id="hud-bottom" class="hud">
      <div id="dialog" class="dialog" aria-live="polite">
        <span class="dialog-when"></span>
        <span class="dialog-text"></span>
      </div>
      <div class="bar">
        <button id="play" type="button" aria-label="Play">▶</button>
        <div id="timeline"></div>
        <button id="speed" type="button" title="Playback speed">1×</button>
      </div>
    </footer>

    <aside id="person-card" class="panel" aria-label="You and this person over time" hidden></aside>

    <div id="title-screen" class="overlay" hidden>
      <div class="overlay-card">
        <div class="eyebrow">Life Connections</div>
        <h1 id="title-name">Loading…</h1>
        <p id="title-sub"></p>
        <button id="start" class="big" type="button">▶ Begin</button>
        <div class="hint">or press space · drag the timeline to jump anywhere · 1–4 switch views</div>
        <div class="lives-pick">
          <div class="eyebrow">Other lives</div>
          <div id="lives"></div>
        </div>
      </div>
    </div>

    <div id="end-screen" class="overlay" hidden>
      <div class="overlay-card">
        <div class="eyebrow" id="end-eyebrow"></div>
        <h1 id="end-title"></h1>
        <div id="end-lines"></div>
        <div class="end-actions">
          <button id="end-again" type="button">↺ Watch again</button>
          <button id="end-journal" type="button">Read the journal</button>
          <button id="end-next" class="big" type="button">Another life ▶</button>
        </div>
      </div>
    </div>

    <div id="tip" role="tooltip" hidden></div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
